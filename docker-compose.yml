services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dataroom
      POSTGRES_USER: dataroom
      POSTGRES_PASSWORD: dataroom
    ports: ["${POSTGRES_PORT:-5435}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataroom -d dataroom"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: local-dev-key
    ports: ["7700:7700"]
    volumes: ["meili_data:/meili_data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dataroom
      MINIO_ROOT_PASSWORD: dataroom-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build: ./apps/api
    env_file: ./apps/api/.env.example
    environment:
      APP_KEY: base64:LOCAL_DEVELOPMENT_REPLACE_ME_32_BYTES_KEY=
      # Local-only admin, created by the seeder on startup. Override via your shell or a root .env.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dataroom.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dataroom-admin}
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8080"]
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      meilisearch: { condition: service_started }

  worker:
    build: ./apps/api
    env_file: ./apps/api/.env.example
    environment:
      APP_KEY: base64:LOCAL_DEVELOPMENT_REPLACE_ME_32_BYTES_KEY=
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=300"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      meilisearch: { condition: service_started }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  meili_data:
  minio_data:
